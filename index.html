<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velirius API · endpoints funcionales</title>
    <meta name="description" content="API REST pública con endpoints funcionales: canvas, anime, download, IA, reactions, search y tools. Lista para Vercel y Render." />
    <meta name="theme-color" content="#f7f7f5" />
    <meta property="og:title" content="Velirius API" />
    <meta property="og:description" content="Routers y endpoints funcionales. Sin token requerido." />
    <meta property="og:image" content="/assets/canvas/banner.jpg" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/api-ui.css" />
  </head>
  <body>
    <div class="fondo-puntos" aria-hidden="true"></div>

    <main class="marco" id="marco">
      <div class="tarjeta" id="tarjeta">
        <header class="cabecera-tarjeta">
          <div class="logo" id="logo">
            <span class="logo__marca">V</span>
            <span class="logo__texto">VELIRIUS</span>
          </div>
          <div class="acciones-superiores">
            <button class="icono" id="boton-tema" type="button" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
            <button class="icono" id="boton-buscar" type="button" title="Buscar ( / )" aria-label="Buscar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.6 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
        </header>

        <div id="contenido" class="contenido" aria-live="polite">
          <div class="cargando"><span></span><span></span><span></span> sincronizando…</div>
        </div>

        <footer class="pie-tarjeta">
          <span>© 2026 &nbsp;|&nbsp; VELIRIUS STORE</span>
          <span class="pie-tarjeta__enlaces">
            <a href="#/docs">Docs</a>
            <a href="/api/openapi.json" target="_blank" rel="noopener">OpenAPI</a>
            <a href="/galeria.html">Galería</a>
          </span>
        </footer>
      </div>
      <p class="nota-fuera">Diseñado a partir de las referencias de Google Drive · Desplegable en Vercel y Render</p>
    </main>

    <!-- Modal del playground -->
    <div class="modal" id="modal" hidden>
      <div class="modal__fondo" data-cerrar></div>
      <div class="modal__caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <div class="modal__cabeza">
          <div>
            <p class="modal__etiqueta" id="modal-categoria">ENDPOINT</p>
            <h2 id="modal-titulo">/api/…</h2>
          </div>
          <button class="icono" id="modal-cerrar" type="button" aria-label="Cerrar">✕</button>
        </div>
        <p class="modal__descripcion" id="modal-descripcion"></p>
        <form id="formulario" class="formulario"></form>
        <div class="modal__acciones">
          <button class="boton boton--negro" id="boton-run" type="button">RUN ▶</button>
          <button class="boton" id="boton-copiar" type="button">Copiar URL</button>
          <button class="boton" id="boton-curl" type="button">Copiar cURL</button>
        </div>
        <div class="resultado" id="resultado">
          <div class="resultado__barra">
            <span id="resultado-estado">LISTO</span>
            <span id="resultado-tiempo"></span>
          </div>
          <div class="resultado__cuerpo" id="resultado-cuerpo">Pulsa RUN para ejecutar el endpoint.</div>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/api-ui.js"></script>
  </body>
</html>
